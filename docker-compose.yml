name: ecommerce-recsys

services:
  # Tracking server + Model Registry, backed by SQLite inside a named volume.
  mlflow:
    build:
      context: .
      target: runtime
    image: ecommerce-recsys:latest
    command:
      - mlflow
      - server
      - --backend-store-uri=sqlite:////mlflow/mlflow.db
      - --artifacts-destination=/mlflow/artifacts
      - --serve-artifacts
      - --host=0.0.0.0
      - --port=5000
    ports:
      - "5000:5000"
    volumes:
      - mlflow-store:/mlflow
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:5000/health')
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Training service: reproduces the DVC pipeline against the MLflow server.
  trainer:
    build:
      context: .
      target: runtime
    image: ecommerce-recsys:latest
    depends_on:
      mlflow:
        condition: service_healthy
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_EXPERIMENT_NAME: ecommerce-recsys
      MLFLOW_REGISTERED_MODEL_NAME: ecommerce-recsys-recommender
      # Empty: the artifacts land wherever the MLflow server serves them from.
      MLFLOW_ARTIFACT_LOCATION: ""
      PARAMS_FILE: configs/params.yaml
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./reports:/app/reports
      - ./configs:/app/configs
      - ./dvc.yaml:/app/dvc.yaml
      - ./dvc.lock:/app/dvc.lock
      - ./.dvc:/app/.dvc
      # DVC resolve o estado do pipeline pelo repositório git do projeto.
      - ./.git:/app/.git
    command: ["dvc", "repro", "--force"]

volumes:
  mlflow-store:
