name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-e-testes:
    name: Lint e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # build via poetry-core; instala o pacote e as deps de runtime.
      - run: pip install .
      - run: pip install pytest ruff
      - run: ruff check src/ tests/
      - run: pytest
