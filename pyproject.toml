[project]
name = "ecommerce-recsys"
version = "0.1.0"
description = "Sistema de recomendação de produtos para e-commerce (Tech Challenge Fase 02)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch (>=2.2,<3.0)",
    "scikit-learn (>=1.4,<2.0)",
    "mlflow (>=2.11,<3.0)",
    "dvc (>=3.50,<4.0)",
    "numpy (>=1.26,<3.0)",
    "pandas (>=2.2,<3.0)",
    "pyarrow (>=15.0,<20.0)",
    "joblib (>=1.3,<2.0)",
    "pyyaml (>=6.0,<7.0)",
    "pydantic (>=2.6,<3.0)",
    "pydantic-settings (>=2.2,<3.0)",
]

[tool.poetry]
packages = [{ include = "recsys", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0,<10.0"
ruff = ">=0.8.6,<1.0"
pre-commit = ">=3.7,<5.0"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # erros do pycodestyle
    "W",    # avisos do pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "N",    # pep8-naming
    "D",    # pydocstyle (docstrings no padrão Google)
    "ANN",  # flake8-annotations (type hints)
    "RUF",  # regras específicas do ruff
]
ignore = [
    "ANN401",  # permite repassar **kwargs tipados como Any
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["recsys"]

[tool.ruff.lint.per-file-ignores]
# Nos testes, legibilidade vale mais que a formalidade de docstrings/anotações.
"tests/**/*.py" = ["D100", "D101", "D102", "D103", "D104", "ANN"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
